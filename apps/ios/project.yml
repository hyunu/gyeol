name: Gyeol
options:
  bundleIdPrefix: com.lge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: XR84FWAH7L
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Gyeol:
    type: application
    platform: iOS
    sources:
      - path: Gyeol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lge.gyeol
        PRODUCT_NAME: Gyeol
        INFOPLIST_FILE: Gyeol/Info.plist
        CODE_SIGN_ENTITLEMENTS: Gyeol/Gyeol.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: GyeolBLE

packages:
  GyeolBLE:
    path: Packages/GyeolBLE

schemes:
  Gyeol:
    build:
      targets:
        Gyeol: all
    run:
      config: Debug
