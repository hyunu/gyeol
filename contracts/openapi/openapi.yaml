openapi: 3.1.0
info:
  title: GYEOL API
  version: 0.2.0-draft
  summary: 웨어러블 대화 기억 서비스 API
  description: |
    웨어러블이 녹음한 음성을 폰이 업로드하고, AI 분석 결과를 조회하는 API.

    ## 공통 규약
    - 본문 `application/json`, 오류 `application/problem+json` (RFC 9457)
    - 시각은 RFC 3339 UTC
    - 목록은 `Page` 봉투, `page` 는 1부터
    - 오류 분기는 `code`
    - 원본 삭제는 M-04 의 5개 조건 충족 시에만 허용

    ## 인증 (임시)
    `X-User-Id` 헤더. **로컬 개발 환경 전용**이며 `GYEOL_ENV != local` 이면 401.
    ADR-0003 참조.
  contact:
    name: GYEOL
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8080
    description: 로컬 개발
tags:
  - name: system
  - name: devices
  - name: recordings
  - name: conversations
  - name: persons
x-gyeol-provisional: true
security:
  - devUserHeader: []

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: 서비스 상태 확인
      security: []
      responses:
        "200":
          description: 정상 또는 일부 저하
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "../schemas/common/health.json"
              examples:
                ok:
                  summary: 정상 + 하드웨어 미연결(skipped)
                  value:
                    status: ok
                    version: 0.2.0
                    time: "2026-11-13T07:00:00Z"
                    checks:
                      - name: db
                        status: skipped
                        detail: 메모리 저장소 사용 중
                      - name: device-link
                        status: skipped
                        detail: 실물 하드웨어 미연결 (HW-PENDING)
        "503":
          description: 서비스 불가
          content:
            application/json:
              schema:
                $ref: "../schemas/common/health.json"

  /api/v1/info:
    get:
      operationId: getServiceInfo
      tags: [system]
      summary: 서비스 메타 정보
      security: []
      responses:
        "200":
          description: 서비스 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"

  /api/v1/devices:
    post:
      operationId: registerDevice
      tags: [devices]
      summary: 기기 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: "../schemas/domain/device.json"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    get:
      operationId: listDevices
      tags: [devices]
      summary: 기기 목록
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 기기 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfDevices"

  /api/v1/devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      operationId: getDevice
      tags: [devices]
      summary: 기기 단건 조회
      responses:
        "200":
          description: 기기
          content:
            application/json:
              schema:
                $ref: "../schemas/domain/device.json"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recordings:
    post:
      operationId: createRecording
      tags: [recordings]
      summary: 녹음 등록 (멱등)
      description: |
        `deviceId + clientRecordingId` 가 같으면 기존 녹음을 반환한다(200).
        새로 만들면 업로드 세션을 함께 발급한다(201).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordingRequest"
      responses:
        "201":
          description: 생성됨 (업로드 세션 발급)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingWithSession"
        "200":
          description: 이미 존재 (멱등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingWithSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    get:
      operationId: listRecordings
      tags: [recordings]
      summary: 녹음 목록
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: deviceId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [initiated, uploading, stored, analyzing, analyzed, analysis_failed, integrity_failed, purged]
        - name: from
          in: query
          description: startedAt 하한 (포함)
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: startedAt 상한 (미포함)
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 녹음 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfRecordings"

  /api/v1/recordings/{recordingId}:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      operationId: getRecording
      tags: [recordings]
      summary: 녹음 단건 조회
      responses:
        "200":
          description: 녹음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRecording
      tags: [recordings]
      summary: 원본 삭제
      description: |
        M-04 의 5개 조건(크기·SHA-256 검증, Object Storage 저장, DB 기록, 클라이언트 ACK)이
        모두 충족되어야 한다. 미충족 시 409 `RECORDING_NOT_DELETABLE`.
      responses:
        "204":
          description: 삭제됨
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recordingId}/upload-sessions:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      operationId: createUploadSession
      tags: [recordings]
      summary: 새 업로드 세션 발급
      description: 기존 세션이 만료·중단된 경우 재전송을 위해 새 세션을 만든다. Recording 은 삭제되지 않는다.
      responses:
        "201":
          description: 세션 발급
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingWithSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recordingId}/upload-sessions/{sessionId}/chunks:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: offset
        in: query
        required: true
        description: 이번 청크의 시작 바이트 오프셋. `nextOffset` 과 일치해야 한다.
        schema: { type: integer, minimum: 0 }
    put:
      operationId: appendChunk
      tags: [recordings]
      summary: 청크 업로드 (재개 가능)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 진행 상황 (마지막 청크면 recording 이 stored 로 전이)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadProgress"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/recordings/{recordingId}/ack:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      operationId: acknowledgeRecording
      tags: [recordings]
      summary: 클라이언트 최종 ACK
      description: |
        클라이언트가 검증 결과를 수신했음을 알린다(M-04 조건 5). 이 호출 이후에만
        `deletable` 이 true 가 된다. 검증 전 호출은 409.
      responses:
        "200":
          description: ACK 기록됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recordingId}/analyze:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      operationId: analyzeRecording
      tags: [recordings]
      summary: AI 분석 작업 등록
      description: |
        분석을 작업 큐에 넣고 즉시 202 를 돌려준다(ADR-0007). 결과는
        `GET /api/v1/analysis-jobs/{jobId}` 로 폴링한다.
        활성 작업(queued|running)이 이미 있으면 새로 만들지 않고 그 작업을 돌려준다(멱등).
        `stored`/`analyzed`/`analysis_failed` 에서만 등록할 수 있고, 재분석은
        이전 작업이 끝난 뒤 새 작업이 되며 `analysisVersion` 이 증가한다.
      responses:
        "202":
          description: 분석 작업 등록됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisAccepted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/analysis-jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAnalysisJob
      tags: [analysis]
      summary: 분석 작업 상태 조회
      description: |
        `status` 가 `succeeded` 또는 `failed` 가 될 때까지 폴링한다.
        성공 시 `conversationId` 로 대화를 조회한다. 타 사용자의 작업은 404.
      responses:
        "200":
          description: 분석 작업
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisJobEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: 대화 목록 및 검색
      description: |
        `q` 가 있으면 하이브리드 검색(키워드 + 의미)을 수행한다. `personId` 로 인물별 조회.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: personId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: 검색어 (최대 200자)
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: 대화 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfConversations"

  /api/v1/conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getConversation
      tags: [conversations]
      summary: 대화 상세
      responses:
        "200":
          description: 대화 상세
          content:
            application/json:
              schema:
                $ref: "../schemas/domain/conversation-detail.json"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/persons:
    get:
      operationId: listPersons
      tags: [persons]
      summary: 인물 목록
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 인물 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfPersons"

  /api/v1/action-items/{actionItemId}:
    parameters:
      - name: actionItemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateActionItem
      tags: [conversations]
      summary: 할 일 상태 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActionItemRequest"
      responses:
        "200":
          description: 변경됨
          content:
            application/json:
              schema:
                $ref: "../schemas/domain/action-item.json"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:
  securitySchemes:
    devUserHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: |
        로컬 개발 전용 임시 인증. `GYEOL_ENV != local` 이면 거부된다(ADR-0003).

  headers:
    NoStore:
      description: 상태 응답은 캐시하지 않는다.
      schema:
        type: string
        const: no-store

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecordingId:
      name: recordingId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    ServiceInfo:
      type: object
      required: [name, apiVersion, contractVersion, provisional]
      properties:
        name: { type: string, const: gyeol }
        apiVersion: { type: string, pattern: "^v[0-9]+$" }
        contractVersion: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+" }
        provisional: { type: boolean }
        capabilities:
          type: array
          items: { type: string }
      additionalProperties: false

    RegisterDeviceRequest:
      type: object
      required: [serialNo, model]
      properties:
        serialNo: { type: string, minLength: 1, maxLength: 120 }
        model: { type: string, minLength: 1 }
        hardwareRevision: { type: string }
        firmwareVersion: { type: string }
      additionalProperties: false

    CreateRecordingRequest:
      type: object
      required:
        [deviceId, clientRecordingId, startedAt, endedAt, durationMs,
         codec, sampleRateHz, channels, byteSize, sha256]
      properties:
        deviceId: { type: string, format: uuid }
        clientRecordingId: { type: string, minLength: 1, maxLength: 200 }
        deviceSeq: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        capturedOffsetMin: { type: integer, minimum: -840, maximum: 840 }
        durationMs: { type: integer, minimum: 1 }
        codec: { type: string, minLength: 1 }
        codecParams: { type: object }
        sampleRateHz: { type: integer, minimum: 1 }
        channels: { type: integer, minimum: 1 }
        byteSize: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        vad: { type: object }
      additionalProperties: false

    UpdateActionItemRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, done, dismissed] }
      additionalProperties: false

    RecordingEnvelope:
      type: object
      required: [recording]
      properties:
        recording:
          $ref: "../schemas/domain/recording.json"
      additionalProperties: false

    RecordingWithSession:
      type: object
      required: [recording, uploadSession]
      properties:
        recording:
          $ref: "../schemas/domain/recording.json"
        uploadSession:
          $ref: "../schemas/domain/upload-session.json"
      additionalProperties: false

    UploadProgress:
      type: object
      required: [recording, uploadSession]
      properties:
        recording:
          $ref: "../schemas/domain/recording.json"
        uploadSession:
          $ref: "../schemas/domain/upload-session.json"
      additionalProperties: false

    AnalysisAccepted:
      type: object
      required: [recording, job]
      properties:
        recording:
          $ref: "../schemas/domain/recording.json"
        job:
          $ref: "../schemas/domain/analysis-job.json"
      additionalProperties: false

    AnalysisJobEnvelope:
      type: object
      required: [job]
      properties:
        job:
          $ref: "../schemas/domain/analysis-job.json"
      additionalProperties: false

    PageOfDevices:
      allOf:
        - $ref: "../schemas/common/page.json"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "../schemas/domain/device.json" }

    PageOfRecordings:
      allOf:
        - $ref: "../schemas/common/page.json"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "../schemas/domain/recording.json" }

    PageOfConversations:
      allOf:
        - $ref: "../schemas/common/page.json"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "../schemas/domain/conversation-summary.json" }

    PageOfPersons:
      allOf:
        - $ref: "../schemas/common/page.json"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "../schemas/domain/person.json" }

  responses:
    BadRequest:
      description: 요청 형식 오류
      content:
        application/problem+json:
          schema: { $ref: "../schemas/common/problem.json" }
    Unauthorized:
      description: 인증 필요/실패
      content:
        application/problem+json:
          schema: { $ref: "../schemas/common/problem.json" }
    NotFound:
      description: 대상 없음
      content:
        application/problem+json:
          schema: { $ref: "../schemas/common/problem.json" }
    Conflict:
      description: 상태 충돌
      content:
        application/problem+json:
          schema: { $ref: "../schemas/common/problem.json" }
    UnprocessableEntity:
      description: 의미상 검증 실패
      content:
        application/problem+json:
          schema: { $ref: "../schemas/common/problem.json" }
    InternalError:
      description: 서버 내부 오류
      content:
        application/problem+json:
          schema: { $ref: "../schemas/common/problem.json" }
