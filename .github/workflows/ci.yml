name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gyeol
          POSTGRES_PASSWORD: gyeol
          POSTGRES_DB: gyeol
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gyeol -d gyeol"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://gyeol:gyeol@localhost:5433/gyeol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: 마이그레이션 적용
        run: npm run db:migrate
      - name: 제약·인덱스 검사
        run: npm run db:checks
      - name: PostgreSQL 통합 테스트
        run: npm run test:db

  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MinIO 기동
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=gyeol -e MINIO_ROOT_PASSWORD=gyeol-minio \
            minio/minio server /data
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: S3 스토리지 테스트
        env:
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_BUCKET: gyeol-ci
          S3_ACCESS_KEY_ID: gyeol
          S3_SECRET_ACCESS_KEY: gyeol-minio
          S3_FORCE_PATH_STYLE: "true"
        run: npm run test:s3

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/esp32s3/platformio.ini') }}
      - run: pip install platformio
      - name: ESP32-S3 펌웨어 빌드
        run: pio run -d firmware/esp32s3

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/web ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: 계약 타입 재생성 후 diff 확인
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.ts
      - name: 타입 검사 + 프로덕션 빌드
        run: npm run build
