; GYEOL 웨어러블 펌웨어 — ESP32-S3 개발 보드 변형
;
; 스펙의 XIAO nRF52840 Sense 는 아직 확보되지 않아 HW-PENDING 이다.
; 현재 연결된 ESP32-S3(8MB PSRAM)로 BLE 프로토콜·SD 저장·PDM 녹음을 먼저 검증한다.
; 프로토콜 자체는 MCU 독립적이다(docs/12-ble-protocol.md).

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
