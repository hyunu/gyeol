services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: gyeol-postgres
    environment:
      POSTGRES_USER: gyeol
      POSTGRES_PASSWORD: gyeol
      POSTGRES_DB: gyeol
    ports:
      - "5433:5432"
    volumes:
      - gyeol-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyeol -d gyeol"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: gyeol-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gyeol
      MINIO_ROOT_PASSWORD: gyeol-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gyeol-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  gyeol-pgdata:
  gyeol-minio-data:
