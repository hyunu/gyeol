services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: gyeol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gyeol
    volumes:
      - gyeol-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyeol -d gyeol"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://gyeol:${POSTGRES_PASSWORD}@db:5432/gyeol
      GYEOL_STORE: postgres
      GYEOL_ENV: local
      GYEOL_STORAGE_DIR: /data/storage
      GYEOL_SEED_DEMO: "true"
      GYEOL_ANALYSIS_WORKER: "on"
      PORT: "8080"
    volumes:
      - gyeol-storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m

  web:
    build: ./web
    ports:
      - "18080:80"
    volumes:
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m

volumes:
  gyeol-pgdata:
  gyeol-storage:
